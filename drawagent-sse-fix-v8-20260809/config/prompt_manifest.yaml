    file: ./prompts/agents/controller.md
    description: Main controller agent that selects skill, asks clarification, dispatches virtual tasks, and decides whether to retry or proceed.
  logic_extraction:
    file: ./prompts/agents/logic_extraction.md
    description: Virtual worker prompt for extracting scientific logic topology.
  style_extraction:
    file: ./prompts/agents/style_extraction.md
    description: Virtual worker prompt for extracting publication style constraints.
  visual_mapping:
    file: ./prompts/agents/visual_mapping.md
    description: Virtual worker prompt for mapping logic and style into layout.
  summarization:
    file: ./prompts/agents/summarization.md
