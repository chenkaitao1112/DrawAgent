[project]
name = "drawagent-version2"
version = "0.1.0"
description = "drawAgent v2 with controller + virtual-worker LangGraph architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "PyYAML>=6.0.2",
  "pypdf>=5.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
